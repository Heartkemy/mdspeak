[project]
name = "mdspeak"
version = "0.1.0"
description = "Experimental local Markdown text-to-speech tools for Apple Silicon Macs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdspeak"]

[project.scripts]
mdspeak = "mdspeak.__main__:main"
mdspeak-speak = "mdspeak.speak:main"

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/Heartkemy/mdspeak"
Issues = "https://github.com/Heartkemy/mdspeak/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: loads a real model"]
